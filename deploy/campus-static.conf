# 高校官网（最简版）Nginx 静态托管配置
# 用途：替代原 campus-web.conf（反代 Next 进程），直接托管 frontend/out/ 静态产物
# 部署：由 deploy/deploy_static.py 自动安装；手工部署见文件底部注释
#
# 与原 frontend/lib/security-headers.ts 等价的安全响应头已挪到此处
# （output: "export" 与应用层 headers() 不兼容，静态站点统一在边缘注入）

limit_req_zone $binary_remote_addr zone=campus_web:10m rate=20r/s;

server {
    listen 80;
    server_name zcmwxy.duckdns.org;

    # 保留 ACME HTTP-01 验证路径（Let's Encrypt 续期）
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name zcmwxy.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/zcmwxy.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zcmwxy.duckdns.org/privkey.pem;

    server_tokens off;
    limit_req zone=campus_web burst=40 nodelay;

    # ---- 安全响应头（与原应用层配置等价）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;

    root /var/www/campus-site/current;
    error_page 404 /404.html;

    # 带哈希的构建产物：长缓存
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # RSS / sitemap：短缓存
    location = /feed.xml   { add_header Cache-Control "public, max-age=600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=600"; }

    # HTML 不缓存（内容更新立即生效）
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # 服务器块级 gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
}

# 手工部署（如不使用 deploy_static.py）：
#   sudo cp campus-static.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/campus-static.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/campus-web.conf
#   sudo nginx -t && sudo systemctl reload nginx
